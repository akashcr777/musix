{% extends 'base.html' %}

{% block title %}
Playlists - My Music
{% endblock %}

{% block content %}

<div class="top-bar">

    <h1 class="page-title">
        📚 Playlists
    </h1>

</div>


<div class="songs">

    {% for playlist in playlists %}

    <a
        href="{% url 'playlist_detail' playlist.id %}"
        style="text-decoration: none; color: inherit;"
    >

        <div class="song-card">

            <div class="cover-placeholder">
                📚
            </div>

            <h3>
                {{ playlist.name }}
            </h3>

            <p class="artist">
                {{ playlist.songs.count }} songs
            </p>

        </div>

    </a>

    {% empty %}

    <p>
        No playlists available.
    </p>

    {% endfor %}

</div>

{% endblock %}
